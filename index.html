<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Moon Lander</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05060c;
  color:#fff;
  font-family:"Courier New",Courier,monospace;
}

canvas{
  display:block;
}

#game{
  width:100vw;
  height:100vh;
}

/* =========================
   MAIN HUD
========================= */

#ui{
  position:fixed;
  top:16px;
  left:18px;
  right:18px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  pointer-events:none;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
  z-index:5;
}

  text-align:right;
  line-height:1.45;
}

/* =========================
   PAUSE BUTTON
========================= */

#pauseBtn{
  position:fixed;
  top:16px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;

  padding:8px 18px;

  border:2px solid #777;
  border-radius:7px;

  background:#10131b;
  color:#fff;

  font:700 16px "Courier New",Courier,monospace;

  cursor:pointer;
}

/* =========================
   BOTTOM CONTROLS
========================= */

#controls{
  position:fixed;
  left:50%;
  bottom:14px;
  transform:translateX(-50%);

  max-width:90vw;

  text-align:center;
  white-space:normal;

  opacity:.75;
  text-shadow:0 2px 5px #000;

  z-index:5;
  pointer-events:none;
}

/* =========================
   MINIMAP
========================= */

#miniBox{
  position:fixed;

  left:18px;
  bottom:58px;

  width:260px;
  height:145px;

  background:rgba(5,7,13,.90);

  border:2px solid #777;
  border-radius:10px;

  overflow:hidden;

  z-index:6;
}

#mini{
  width:260px;
  height:145px;
}

#miniTitle{
  position:absolute;
  top:5px;
  left:9px;

  font-size:11px;
  font-weight:bold;

  opacity:.8;
  z-index:2;
}

/* =========================
   MENUS / OVERLAYS
========================= */

.overlay{
  display:none;

  position:fixed;
  inset:0;

  background:rgba(0,0,0,.78);

  align-items:center;
  justify-content:center;

  flex-direction:column;

  text-align:center;

  z-index:25;
}

#mainMenu{
  display:flex;
}

.overlay h1{
  font-size:52px;
  margin:0 0 14px;
}

.overlay p{
  opacity:.75;
  margin:0 0 24px;
}

.menuButtons{
  display:flex;
  flex-direction:column;
  gap:14px;

  width:min(300px,80vw);
}

.menuButtons button{
  width:100%;
}

button{
  padding:12px 20px;

  border:0;
  border-radius:9px;

  background:#e8e8e8;
  color:#111;

  font:700 18px "Courier New",Courier,monospace;

  cursor:pointer;
}

button:hover{
  filter:brightness(1.15);
}

#easyBtn{
  background:#1d9b58;
  color:#fff;
}

#hardBtn{
  background:#a92828;
  color:#fff;
}

#pauseOverlay{
  display:none;
}

#pauseOverlay h1{
  margin-bottom:24px;
}

/* =========================
   RESULT
========================= */

#message{
  display:none;

  position:fixed;
  inset:0;

  background:rgba(0,0,0,.72);

  align-items:center;
  justify-content:center;

  flex-direction:column;

  text-align:center;

  z-index:20;
}

#message h1{
  font-size:52px;
  margin:0 0 12px;
}

#message p{
  font-size:19px;
  max-width:80vw;
}

#landAgainBtn{
  margin-top:12px;
}

/* =========================
   MOBILE / SMALL SCREEN
========================= */

@media(max-width:700px){

  #ui{
    font-size:12px;
    left:10px;
    right:10px;
  }

  #pauseBtn{
    top:55px;
    font-size:13px;
    padding:6px 12px;
  }

  #miniBox{
    width:210px;
    height:118px;
    left:10px;
    bottom:48px;
  }

  #mini{
    width:210px;
    height:118px;
  }

  #controls{
    font-size:11px;
    bottom:8px;
  }

  .overlay h1{
    font-size:38px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- =========================
     MAIN MENU
========================= -->

<div id="mainMenu" class="overlay">

  <h1>MOON LANDER</h1>

  <p>SELECT DIFFICULTY</p>

  <div class="menuButtons">
    <button id="easyBtn">EASY</button>
    <button id="hardBtn">HARD ↑</button>
  </div>

</div>

<!-- =========================
     PAUSE
========================= -->

<button id="pauseBtn" type="button">PAUSE</button>

<div id="pauseOverlay" class="overlay">

  <h1>PAUSED</h1>

  <div class="menuButtons">

    <button id="resumeBtn" type="button">
      RESUME
    </button>

    <button id="pauseRestartBtn" type="button">
      RESTART
    </button>

    <button id="exitMenuBtn" type="button">
      EXIT TO MAIN MENU
    </button>

  </div>

</div>

<!-- =========================
     HUD
========================= -->

<div id="ui">

  <div>
    MOON LANDER
    <div id="modeLabel"></div>
  </div>

  <div id="stats"></div>

</div>

<!-- =========================
     MINIMAP
========================= -->

<div id="miniBox">

  <div id="miniTitle">
    MOON MAP
  </div>

  <canvas
    id="mini"
    width="520"
    height="290">
  </canvas>

</div>

<!-- =========================
     CONTROLS
========================= -->

<div id="controls">
  W / S = THROTTLE
  &nbsp;&nbsp;
  ↑ = ENGINE
  &nbsp;&nbsp;
  ← → = ROTATE
  &nbsp;&nbsp;
  R = RESTART
  &nbsp;&nbsp;
  ESC = PAUSE
</div>

<!-- =========================
     RESULT
========================= -->

<div id="message">

  <h1 id="result"></h1>

  <p id="resultInfo"></p>

  <button id="landAgainBtn">
    LAND AGAIN
  </button>

</div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const mini = document.getElementById("mini");
const mctx = mini.getContext("2d");

let W = 1;
let H = 1;
let dpr = 1;


/* =========================================================
   WORLD
========================================================= */

const MAP_WIDTH = 10000;

let terrain = {
  step:70,
  values:[]
};

let stars = [];
let landingPad = null;
let lander = null;

let fuel = 250;
let throttle = 100;

let cameraX = 0;
let cameraY = 0;

let groundBase = 700;


/* =========================================================
   DIFFICULTY
========================================================= */

let difficulty = "easy";

const EASY = {
  gravity:38,
  maxThrust:145,
  rotation:2.7,
  fuel:250
};

const HARD = {
  gravity:52,
  maxThrust:120,
  rotation:2.35,
  fuel:300
};

function getConfig(){
  return difficulty === "hard" ? HARD : EASY;
}


/* =========================================================
   GAME STATE
========================================================= */

let gameState = "menu";
let paused = false;


/* =========================================================
   INPUT
========================================================= */

const keys = Object.create(null);

window.addEventListener("keydown",e=>{

  const k = e.key;

  keys[k] = true;

  if([
    "ArrowUp",
    "ArrowDown",
    "ArrowLeft",
    "ArrowRight",
    " "
  ].includes(k)){
    e.preventDefault();
  }

  if(k.toLowerCase() === "r"){
    if(gameState === "playing"){
      resetGame();
    }
  }

  if(k === "Escape"){
    if(gameState === "playing"){
      togglePause();
    }
  }

});

window.addEventListener("keyup",e=>{
  keys[e.key] = false;
});


/* =========================================================
   UTILITIES
========================================================= */

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}

function lerp(a,b,t){
  return a+(b-a)*t;
}

function smoothstep(t){
  t=clamp(t,0,1);
  return t*t*(3-2*t);
}


/* =========================================================
   TERRAIN HEIGHT
========================================================= */

function groundHeight(x){

  if(
    !terrain ||
    !terrain.values ||
    !terrain.values.length
  ){
    return groundBase;
  }

  x=clamp(x,0,MAP_WIDTH);

  const step=terrain.step;

  const p=x/step;

  const i=Math.floor(p);

  const t=p-i;

  if(i>=terrain.values.length-1){
    return terrain.values[
      terrain.values.length-1
    ];
  }

  return lerp(
    terrain.values[i],
    terrain.values[i+1],
    smoothstep(t)
  );
}


/* =========================================================
   RANDOM TERRAIN
========================================================= */

function makeTerrain(){

  const step=70;

  const count=
    Math.ceil(MAP_WIDTH/step)+1;

  const values=[];

  groundBase=700;

  const p1=Math.random()*Math.PI*2;
  const p2=Math.random()*Math.PI*2;
  const p3=Math.random()*Math.PI*2;
  const p4=Math.random()*Math.PI*2;
  const p5=Math.random()*Math.PI*2;

  const a1=220+Math.random()*90;
  const a2=130+Math.random()*90;
  const a3=70+Math.random()*60;

  for(let i=0;i<count;i++){

    const x=i*step;

    const mountains =
      Math.sin(x*.00052+p1)*a1 +
      Math.sin(x*.00093+p2)*a2 +
      Math.sin(x*.00165+p3)*a3;

    const hills =
      Math.sin(x*.0037+p4)*
      (35+Math.random()*20) +

      Math.sin(x*.0068+p5)*
      (18+Math.random()*15);

    const noise=
      (Math.random()-.5)*20;

    values.push(
      clamp(
        groundBase+
        mountains+
        hills+
        noise,
        180,
        1180
      )
    );
  }

  /* Smooth terrain */

  for(let pass=0;pass<2;pass++){

    const copy=values.slice();

    for(
      let i=1;
      i<values.length-1;
      i++
    ){

      values[i]=
        (
          copy[i-1]+
          copy[i]*2+
          copy[i+1]
        )/4;
    }
  }

  terrain={
    step,
    values
  };
}


/* =========================================================
   LANDING PAD
========================================================= */

function makeLandingPad(){

  const width =
    difficulty === "hard"
      ? 145
      : 190;

  const half=width/2;

  const transition=230;

  const minX=700;
  const maxX=MAP_WIDTH-700;

  const center=
    minX+
    Math.random()*
    (maxX-minX);

  const padY=
    groundHeight(center);

  for(
    let i=0;
    i<terrain.values.length;
    i++
  ){

    const x=i*terrain.step;

    const d=Math.abs(x-center);

    if(d<=half){

      terrain.values[i]=padY;

    }else if(
      d<half+transition
    ){

      const t=
        (d-half)/transition;

      const s=smoothstep(t);

      const original=
        terrain.values[i];

      terrain.values[i]=
        lerp(
          padY,
          original,
          s
        );
    }
  }

  landingPad={
    center,
    width,
    half,
    y:groundHeight(center)
  };
}


/* =========================================================
   STARS
========================================================= */

function makeStars(){

  stars=[];

  for(let i=0;i<420;i++){

    stars.push({

      x:
        Math.random()*
        MAP_WIDTH,

      y:
        Math.random()*
        Math.max(H*4,3000)
        -900,

      r:
        .3+
        Math.random()*1.5,

      a:
        .25+
        Math.random()*.75
    });
  }
}


/* =========================================================
   RANDOM SPAWN
========================================================= */

function randomSpawnX(){

  for(let tries=0;tries<100;tries++){

    const x=
      350+
      Math.random()*
      (MAP_WIDTH-700);

    if(
      Math.abs(
        x-landingPad.center
      )>900
    ){
      return x;
    }
  }

  return landingPad.center>
    MAP_WIDTH/2
    ?600
    :MAP_WIDTH-600;
}


/* =========================================================
   RESET GAME
========================================================= */

function resetGame(){

  paused=false;

  document.getElementById(
    "pauseOverlay"
  ).style.display="none";

  document.getElementById(
    "pauseBtn"
  ).textContent="PAUSE";


  makeTerrain();

  makeLandingPad();

  makeStars();


  const x=randomSpawnX();

  const altitude=
    350+
    Math.random()*900;


  lander={

    x,

    y:
      groundHeight(x)
      -altitude,

    vx:
      (Math.random()-.5)*10,

    vy:
      (Math.random()-.5)*5,

    angle:
      (Math.random()-.5)*.12,

    width:32,

    height:44
  };


  fuel=getConfig().fuel;

  throttle=100;

  gameState="playing";


  cameraX=
    lander.x-
    W*.5;

  cameraY=
    lander.y-
    H*.5;

  clampCamera();


  document.getElementById(
    "message"
  ).style.display="none";


  document.getElementById(
    "modeLabel"
  ).textContent=
    difficulty.toUpperCase();


  updateVisibility();
}


/* =========================================================
   UI VISIBILITY
========================================================= */

function updateVisibility(){

  const playing =
    gameState !== "menu";

  document.getElementById(
    "pauseBtn"
  ).style.display=
    playing ? "block" : "none";

  document.getElementById(
    "ui"
  ).style.display=
    playing ? "flex" : "none";

  document.getElementById(
    "controls"
  ).style.display=
    playing ? "block" : "none";


  /*
     HARD MODE:
     NO MINIMAP
  */

  const miniVisible=
    playing &&
    difficulty === "easy";

  document.getElementById(
    "miniBox"
  ).style.display=
    miniVisible ? "block" : "none";
}


/* =========================================================
   MAIN MENU
========================================================= */

function startGame(mode){

  difficulty=mode;

  document.getElementById(
    "mainMenu"
  ).style.display="none";

  resetGame();
}


function exitToMainMenu(){

  paused=false;

  gameState="menu";

  document.getElementById(
    "pauseOverlay"
  ).style.display="none";

  document.getElementById(
    "message"
  ).style.display="none";

  document.getElementById(
    "mainMenu"
  ).style.display="flex";

  updateVisibility();
}


/* =========================================================
   RESIZE
========================================================= */

function resize(){

  W=Math.max(
    1,
    window.innerWidth
  );

  H=Math.max(
    1,
    window.innerHeight
  );

  dpr=Math.min(
    window.devicePixelRatio||1,
    2
  );

  canvas.width=
    Math.floor(W*dpr);

  canvas.height=
    Math.floor(H*dpr);

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );
}

window.addEventListener(
  "resize",
  resize
);


/* =========================================================
   STARS
========================================================= */

function drawStars(){

  for(const s of stars){

    const x=
      s.x-
      cameraX*.08;

    const y=
      s.y-
      cameraY*.08;

    if(
      x<-5||
      x>W+5||
      y<-5||
      y>H+5
    ){
      continue;
    }

    ctx.globalAlpha=s.a;

    ctx.fillStyle="#fff";

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      s.r,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;
}


/* =========================================================
   MOON
========================================================= */

function drawMoon(){

  const start=
    Math.max(
      0,
      cameraX-100
    );

  const end=
    Math.min(
      MAP_WIDTH,
      cameraX+W+100
    );


  ctx.fillStyle="#38393f";

  ctx.beginPath();

  ctx.moveTo(0,H);


  for(
    let x=start;
    x<=end;
    x+=20
  ){

    ctx.lineTo(
      x-cameraX,
      groundHeight(x)-cameraY
    );
  }


  ctx.lineTo(W,H);

  ctx.closePath();

  ctx.fill();


  /* Surface */

  ctx.strokeStyle="#707176";

  ctx.lineWidth=2;

  ctx.beginPath();

  let first=true;

  for(
    let x=start;
    x<=end;
    x+=20
  ){

    const sx=
      x-cameraX;

    const sy=
      groundHeight(x)-
      cameraY;

    if(first){

      ctx.moveTo(sx,sy);

      first=false;

    }else{

      ctx.lineTo(sx,sy);
    }
  }

  ctx.stroke();


  /* Craters */

  ctx.strokeStyle="#25262b";

  ctx.lineWidth=3;

  const firstC=
    Math.floor(start/210)-1;

  const lastC=
    Math.ceil(end/210)+1;


  for(
    let i=firstC;
    i<=lastC;
    i++
  ){

    const x=
      i*210+75;

    if(
      x<0||
      x>MAP_WIDTH
    ){
      continue;
    }

    const y=
      groundHeight(x)+
      24-
      cameraY;

    ctx.beginPath();

    ctx.ellipse(
      x-cameraX,
      y,
      24+(i%3)*6,
      7,
      0,
      0,
      Math.PI*2
    );

    ctx.stroke();
  }
}


/* =========================================================
   LANDING PAD
========================================================= */

function drawLandingPad(){

  if(!landingPad)return;

  const left=
    landingPad.center-
    landingPad.half;

  const x=
    left-cameraX;

  const y=
    landingPad.y-cameraY;


  if(
    x>W+250||
    x+landingPad.width<-250
  ){
    return;
  }


  ctx.strokeStyle="#8d9197";

  ctx.lineWidth=4;

  ctx.beginPath();

  ctx.moveTo(
    x+22,
    y+8
  );

  ctx.lineTo(
    x+32,
    y+30
  );

  ctx.moveTo(
    x+
    landingPad.width-
    22,
    y+8
  );

  ctx.lineTo(
    x+
    landingPad.width-
    32,
    y+30
  );

  ctx.stroke();


  ctx.fillStyle="#c8ccd1";

  ctx.fillRect(
    x,
    y,
    landingPad.width,
    10
  );


  ctx.strokeStyle="#55585d";

  ctx.lineWidth=2;

  ctx.strokeRect(
    x,
    y,
    landingPad.width,
    10
  );


  ctx.font=
    "bold 14px 'Courier New',Courier,monospace";

  ctx.fillStyle="#55585d";

  ctx.textAlign="center";

  ctx.fillText(
    "LAND",
    x+
    landingPad.width/2,
    y-8
  );
}


/* =========================================================
   LANDER
========================================================= */

function drawLander(){

  if(!lander)return;

  const x=
    lander.x-cameraX;

  const y=
    lander.y-cameraY;


  ctx.save();

  ctx.translate(x,y);

  ctx.rotate(lander.angle);


  const engineOn=
    keys["ArrowUp"] &&
    fuel>0 &&
    throttle>0 &&
    gameState==="playing";


  if(engineOn){

    const len=
      20+
      throttle*.40+
      Math.random()*7;

    const w=
      4+
      throttle*.07;


    ctx.shadowBlur=14;

    ctx.shadowColor="#45bfff";

    ctx.fillStyle="#188cff";

    ctx.beginPath();

    ctx.moveTo(-w,18);

    ctx.lineTo(
      0,
      18+len
    );

    ctx.lineTo(w,18);

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle="#dff8ff";

    ctx.beginPath();

    ctx.moveTo(
      -w*.42,
      18
    );

    ctx.lineTo(
      0,
      18+len*.62
    );

    ctx.lineTo(
      w*.42,
      18
    );

    ctx.closePath();

    ctx.fill();

    ctx.shadowBlur=0;
  }


  ctx.fillStyle="#dce0e5";

  ctx.strokeStyle="#656970";

  ctx.lineWidth=2;


  ctx.beginPath();

  ctx.moveTo(-16,17);

  ctx.lineTo(-11,-13);

  ctx.lineTo(11,-13);

  ctx.lineTo(16,17);

  ctx.closePath();

  ctx.fill();

  ctx.stroke();


  ctx.fillStyle="#c9cdd2";

  ctx.fillRect(
    -10,
    -19,
    20,
    7
  );


  ctx.fillStyle="#70abc5";

  ctx.fillRect(
    -6,
    -17,
    12,
    5
  );


  ctx.strokeStyle="#a4a8ad";

  ctx.lineWidth=3;


  ctx.beginPath();

  ctx.moveTo(-13,9);

  ctx.lineTo(-27,25);

  ctx.lineTo(-10,25);

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(13,9);

  ctx.lineTo(27,25);

  ctx.lineTo(10,25);

  ctx.stroke();


  ctx.restore();
}


/* =========================================================
   FEET
========================================================= */

function feetWorld(){

  const localFeet=[
    {x:-27,y:25},
    {x:27,y:25}
  ];


  return localFeet.map(p=>{

    const c=
      Math.cos(lander.angle);

    const s=
      Math.sin(lander.angle);


    return{

      x:
        lander.x+
        p.x*c-
        p.y*s,

      y:
        lander.y+
        p.x*s+
        p.y*c
    };
  });
}


/* =========================================================
   THROTTLE
========================================================= */

function updateThrottle(dt){

  if(keys["w"]||keys["W"]){

    throttle+=60*dt;
  }

  if(keys["s"]||keys["S"]){

    throttle-=60*dt;
  }

  throttle=
    clamp(
      throttle,
      0,
      100
    );
}


/* =========================================================
   PHYSICS
========================================================= */

function crash(text){

  if(gameState!=="playing"){
    return;
  }

  gameState="crashed";

  showResult(
    "CRASH!",
    text
  );
}


function land(){

  if(gameState!=="playing"){
    return;
  }

  gameState="landed";

  showResult(
    "SOFT LANDING!",
    "You landed safely on the Moon."
  );
}


function updatePhysics(dt){

  if(
    gameState!=="playing"||
    paused
  ){
    return;
  }


  const c=getConfig();


  /* Rotation */

  if(keys["ArrowLeft"]){

    lander.angle-=
      c.rotation*dt;
  }

  if(keys["ArrowRight"]){

    lander.angle+=
      c.rotation*dt;
  }


  /* Gravity */

  lander.vy+=
    c.gravity*dt;


  /* Engine */

  const engineOn=
    keys["ArrowUp"] &&
    fuel>0 &&
    throttle>0;


  if(engineOn){

    const thrust=
      c.maxThrust*
      throttle/100;


    lander.vx+=
      Math.sin(
        lander.angle
      )*
      thrust*
      dt;


    lander.vy-=
      Math.cos(
        lander.angle
      )*
      thrust*
      dt;


    const fuelRate=
      difficulty==="hard"
        ?20
        :16;


    fuel=Math.max(
      0,
      fuel-
      fuelRate*
      (throttle/100)*
      dt
    );
  }


  /* Position */

  lander.x+=
    lander.vx*dt;

  lander.y+=
    lander.vy*dt;


  /* World edges */

  if(lander.x<40){

    lander.x=40;

    lander.vx*=-.25;
  }


  if(
    lander.x>
    MAP_WIDTH-40
  ){

    lander.x=
      MAP_WIDTH-40;

    lander.vx*=-.25;
  }


  /* Collision */

  const feet=feetWorld();

  const lowestFoot=
    Math.max(
      feet[0].y,
      feet[1].y
    );


  const terrainAtFeet=
    Math.min(
      groundHeight(feet[0].x),
      groundHeight(feet[1].x)
    );


  if(
    lowestFoot>=terrainAtFeet
  ){

    const left=
      landingPad.center-
      landingPad.half;

    const right=
      landingPad.center+
      landingPad.half;


    const bothFeetOnPad=
      feet.every(
        f=>
          f.x>=left &&
          f.x<=right
      );


    const safeV=
      Math.abs(lander.vy)<
      (
        difficulty==="hard"
          ?32
          :45
      );


    const safeH=
      Math.abs(lander.vx)<
      (
        difficulty==="hard"
          ?28
          :38
      );


    const safeA=
      Math.abs(lander.angle)<
      (
        difficulty==="hard"
          ?0.18
          :0.25
      );


    if(
      bothFeetOnPad &&
      safeV &&
      safeH &&
      safeA
    ){

      land();

    }else if(
      bothFeetOnPad
    ){

      crash(
        "You reached the pad, but the landing was too hard or tilted."
      );

    }else{

      crash(
        "You missed the landing pad."
      );
    }
  }
}


/* =========================================================
   CAMERA
========================================================= */

function clampCamera(){

  cameraX=
    clamp(
      cameraX,
      0,
      Math.max(
        0,
        MAP_WIDTH-W
      )
    );


  const maxDown=
    groundBase-
    H*.25;


  cameraY=
    Math.min(
      cameraY,
      maxDown
    );
}


function updateCamera(){

  if(!lander)return;


  const targetX=
    lander.x-
    W*.5;


  const targetY=
    lander.y-
    H*.5;


  cameraX+=
    (targetX-cameraX)*
    .10;


  cameraY+=
    (targetY-cameraY)*
    .10;


  clampCamera();
}


/* =========================================================
   MINIMAP
========================================================= */

function drawMiniMap(){

  /*
     HARD MODE HAS NO MINIMAP.
  */

  if(
    difficulty==="hard"||
    !terrain.values.length||
    !landingPad||
    !lander
  ){
    return;
  }


  const mw=520;
  const mh=290;


  mctx.clearRect(
    0,
    0,
    mw,
    mh
  );


  mctx.fillStyle="#090b12";

  mctx.fillRect(
    0,
    0,
    mw,
    mh
  );


  const l=12;
  const r=mw-12;

  /*
     IMPORTANT:
     The map uses a LARGE vertical world range.

     This means the terrain is shown as a
     far-away view instead of stretching
     the mountains to fill the minimap.
  */

  const worldTop=0;
  const worldBottom=1250;

  const mapW=r-l;
  const mapH=mh-45;


  function mapX(worldX){

    return l+
      (worldX/MAP_WIDTH)*
      mapW;
  }


  function mapY(worldY){

    return 25+
      ((worldY-worldTop)/
      (worldBottom-worldTop))*
      mapH;
  }


  /* Terrain */

  mctx.fillStyle="#45464c";

  mctx.beginPath();

  mctx.moveTo(
    l,
    mh
  );


  for(
    let i=0;
    i<terrain.values.length;
    i++
  ){

    const worldX=
      i*terrain.step;

    const sx=
      mapX(worldX);

    const sy=
      mapY(
        terrain.values[i]
      );


    mctx.lineTo(
      sx,
      sy
    );
  }


  mctx.lineTo(
    r,
    mh
  );

  mctx.closePath();

  mctx.fill();


  /* Terrain outline */

  mctx.strokeStyle="#9da1a8";

  mctx.lineWidth=1.5;

  mctx.beginPath();


  for(
    let i=0;
    i<terrain.values.length;
    i++
  ){

    const sx=
      mapX(
        i*terrain.step
      );

    const sy=
      mapY(
        terrain.values[i]
      );


    if(i===0){

      mctx.moveTo(
        sx,
        sy
      );

    }else{

      mctx.lineTo(
        sx,
        sy
      );
    }
  }

  mctx.stroke();


  /* Landing pad */

  const px=
    mapX(
      landingPad.center
    );

  const py=
    mapY(
      landingPad.y
    );


  mctx.fillStyle="#fff";

  mctx.fillRect(
    px-7,
    py-2,
    14,
    3
  );


  mctx.font=
    "bold 11px 'Courier New',Courier,monospace";

  mctx.textAlign="center";

  mctx.fillStyle="#fff";

  mctx.fillText(
    "LAND",
    px,
    Math.max(
      14,
      py-5
    )
  );


  /* Lander */

  const playerX=
    mapX(
      lander.x
    );


  const groundY=
    groundHeight(
      lander.x
    );


  /*
     Use the real world altitude,
     but keep it subtle because this
     is supposed to be a far-away
     map view.
  */

  const altitude=
    Math.max(
      0,
      groundY-
      lander.y
    );


  const playerWorldY=
    Math.max(
      20,
      groundY-
      altitude
    );


  const playerY=
    mapY(
      playerWorldY
    );


  mctx.fillStyle="#55cfff";

  mctx.beginPath();

  mctx.moveTo(
    playerX,
    playerY-5
  );

  mctx.lineTo(
    playerX-4,
    playerY+4
  );

  mctx.lineTo(
    playerX+4,
    playerY+4
  );

  mctx.closePath();

  mctx.fill();


  /*
     Camera box removed.

     The minimap is now simply a
     far-away vision of the whole map.
  */
}


/* =========================================================
   RESULT
========================================================= */

function showResult(
  title,
  text
){

  document.getElementById(
    "result"
  ).textContent=title;

  document.getElementById(
    "resultInfo"
  ).textContent=text;

  document.getElementById(
    "message"
  ).style.display="flex";
}


/* =========================================================
   HUD
========================================================= */

function updateUI(){

  if(!lander)return;


  const alt=
    Math.max(
      0,
      groundHeight(
        lander.x
      )-
      lander.y
    );


  document.getElementById(
    "stats"
  ).innerHTML=

    `FUEL ${Math.round(fuel)}<br>`+

    `THROTTLE ${Math.round(throttle)}%<br>`+

    `Vx ${Math.round(lander.vx)} &nbsp; `+
    `Vy ${Math.round(lander.vy)}<br>`+

    `ALT ${Math.round(alt)}<br>`+

    `MAP ${Math.round(
      lander.x/MAP_WIDTH*100
    )}%`;
}


/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

  if(
    gameState!=="playing"
  ){
    return;
  }


  paused=!paused;


  document.getElementById(
    "pauseOverlay"
  ).style.display=
    paused
      ? "flex"
      : "none";


  document.getElementById(
    "pauseBtn"
  ).textContent=
    paused
      ? "RESUME"
      : "PAUSE";
}

   BUTTONS
========================================================= */

);


document.getElementById(

).addEventListener(

);

   START
========================================================= */

resize();

document.getElementById(
  "pauseBtn"
).style.display="none";

document.getElementById(
  "ui"
).style.display="none";

document.getElementById(
  "miniBox"
).style.display="none";

document.getElementById(
  "controls"
).style.display="none";


/* =========================================================
   GAME LOOP
========================================================= */

let last=
  performance.now();


function loop(now){

  const dt=
    Math.min(
      (now-last)/1000,
      .035
    );

  last=now;


  if(gameState!=="menu"){

    updateThrottle(dt);

    updatePhysics(dt);

    updateCamera();


    ctx.clearRect(
      0,
      0,
      W,
      H
    );


    drawStars();

    drawMoon();

    drawLandingPad();

    drawLander();

    drawMiniMap();

    updateUI();

  }else{

    ctx.clearRect(
      0,
      0,
      W,
      H
    );

    ctx.fillStyle="#05060c";

    ctx.fillRect(
      0,
      0,
      W,
      H
    );
  }


  requestAnimationFrame(
    loop
  );
}


requestAnimationFrame(
  loop
);

</script>
